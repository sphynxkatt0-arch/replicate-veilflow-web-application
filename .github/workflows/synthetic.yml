name: Browser Synthetic

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: synthetic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build tested artifact
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run VeilFlow browser workflow
        run: npx playwright test --project=desktop-chromium
      - name: Upload browser evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: veilflow-browser-evidence-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
